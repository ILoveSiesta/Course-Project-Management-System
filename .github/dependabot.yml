# Dependabot proposes updates for the GitHub Actions used by the workflows
# (actions are pinned to full commit SHAs). Only github-actions, as in the
# Lab 5 starter kit; npm dependency upgrades are out of scope for Lab 5 (#21).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
