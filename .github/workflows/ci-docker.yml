name: CI & Docker Build

on:
  workflow_call:
  pull_request:
    branches: [main, lab5-staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cpms
          POSTGRES_PASSWORD: cpms
          POSTGRES_DB: cpms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cpms -d cpms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://cpms:cpms@localhost:5432/cpms?schema=public
      JWT_SECRET: ci-only-jwt-secret-placeholder-not-production
      SEED_DEMO_PASSWORD: ci-only-demo-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Check deploy scripts
        run: |
          bash -n deploy/deploy.sh deploy/release.sh deploy/teardown.sh
          bash deploy/tests/test_deploy_stub.sh
          bash deploy/tests/test_release_stub.sh
          python3 -m unittest discover -s deploy/tests -p "test_*.py" -v

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client

      - name: Migrate, seed, build, and test backend
        run: |
          npm run prisma:generate --prefix server
          npm run prisma:deploy --prefix server
          npm run prisma:seed --prefix server
          npm run build --prefix server
          npm test --prefix server

      - name: Test and build frontend
        run: |
          npm test --prefix client
          npm run build --prefix client

      - name: Run Playwright E2E tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Verify Docker build
        run: docker build -t cpms-app:ci .
