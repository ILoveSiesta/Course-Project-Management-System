name: CI & Docker Build

on:
  workflow_call:
  pull_request:
    branches: [main, lab5-staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cpms
          POSTGRES_PASSWORD: cpms
          POSTGRES_DB: cpms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cpms -d cpms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://cpms:cpms@localhost:5432/cpms?schema=public
      JWT_SECRET: ci-only-jwt-secret-placeholder-not-production
      SEED_DEMO_PASSWORD: ci-only-demo-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check deploy scripts
        run: |
          bash deploy/tests/test_deploy_stub.sh
          bash deploy/tests/test_release_stub.sh
          python3 -m unittest discover -s deploy/tests -p "test_*.py" -v

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client

      - name: Migrate, seed, build, and test backend
        run: |
          npm run prisma:generate --prefix server
          npm run prisma:deploy --prefix server
          npm run prisma:seed --prefix server
          npm run build --prefix server
          npm test --prefix server

      - name: Test and build frontend
        run: |
          npm test --prefix client
          npm run build --prefix client

      - name: Run Playwright E2E tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Verify Docker build
        run: docker build -t cpms-app:ci .
