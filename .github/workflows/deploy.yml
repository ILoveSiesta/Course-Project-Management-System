# ##############################################################################
# Deploy demo: automatic deployment of CPMS to Google Cloud Run (Lab 5, #21)
# ##############################################################################
# Adapted from the Lab 5 starter kit (.github/workflows/deploy.yml).
# Changes from the kit: CPMS names (service cpms, job cpms-migrate, image
# cpms/cpms) and the smoke-test line in the run summary.
#
# On every push to `main` (a merged release PR) or a manual run it:
#   1) runs the CI workflow (ci-docker.yml, job `test-and-docker`) first,
#   2) signs in to Google Cloud without a key file (Workload Identity Federation),
#   3) builds and pushes the image tagged with the full commit SHA,
#   4) runs deploy/release.sh (resolve digest -> migration job -> update service),
#   5) smoke-tests the public URL (deploy/smoke_test.py),
#   6) writes a deployment summary.
# MANUAL ROLLBACK: Actions -> Deploy demo -> Run workflow on `main` with
# `image_tag` = the full 40-character SHA of an image that already exists.
# Tests, build and migration are skipped; only the service moves to that image.
#
# Do not rename (they must match other places exactly):
#   - environment `demo` (also the end of the WIF condition, Student Guide 6.3)
#   - this file name `deploy.yml` (also in the WIF condition)
#   - variables GCP_PROJECT_ID, GCP_REGION, WIF_PROVIDER, WIF_SERVICE_ACCOUNT
#     (Settings -> Environments -> demo; variables, not secrets)
# Optional login smoke check: variable SMOKE_EMAIL + secret SMOKE_PASSWORD
# (set both or neither; CPMS currently sets neither, so the step prints SKIP).
# The cloud resources must already exist (created once with deploy/deploy.sh).
# ##############################################################################

name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Rollback: full commit SHA of an existing image. Empty = test, build and deploy current main.'
        type: string
        required: false
        default: ''

# Least privilege by default; the deploy job adds `id-token: write` below.
permissions:
  contents: read

# Queue releases; never interrupt a running migration or deployment.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  # Job 1: the CI workflow (job `test-and-docker`). Skipped for rollbacks.
  test:
    if: github.ref == 'refs/heads/main' && !inputs.image_tag
    uses: ./.github/workflows/ci-docker.yml

  # Job 2: build, migrate, deploy, smoke-test. Runs only after green tests,
  # or for a manual rollback (tests skipped on purpose).
  deploy:
    needs: test
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.test.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.image_tag != '' && needs.test.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo
    permissions:
      contents: read
      id-token: write # required for keyless Google Cloud sign-in (WIF)
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      # CPMS resource names (deploy/release.sh uses the same names).
      SERVICE_NAME: cpms
      MIGRATE_JOB_NAME: cpms-migrate
      # Image tag = merged commit SHA, or the rollback SHA typed in.
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      ROLLBACK: ${{ inputs.image_tag != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate deployment settings
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROJECT_ID" && test -n "$REGION"
          test -n "$WIF_PROVIDER" && test -n "$WIF_SERVICE_ACCOUNT"
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo 'Image tag must be a full 40-character commit SHA.'; exit 1; }

      - name: Authenticate to Google Cloud without a key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Skipped for rollbacks. The path must match the Artifact Registry repo
      # `cpms` and image `cpms` (same as deploy/release.sh).
      - name: Build and push image
        if: env.ROLLBACK != 'true'
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/cpms/cpms:$IMAGE_TAG"
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      # Resolves the digest, runs cpms-migrate (not for rollbacks), updates the
      # cpms service and sends 100% traffic to it. Exports SERVICE_URL and
      # DEPLOYED_IMAGE to $GITHUB_ENV.
      - name: Verify image, migrate and deploy
        run: bash deploy/release.sh

      - name: Setup Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Smoke test public URL
        env:
          SMOKE_EMAIL: ${{ vars.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: python3 deploy/smoke_test.py "$SERVICE_URL"

      - name: Record deployment
        run: |
          {
            echo '### CPMS demo deployment'
            echo "- Commit image tag: \`$IMAGE_TAG\`"
            echo "- Digest: \`$DEPLOYED_IMAGE\`"
            echo "- Rollback: $ROLLBACK"
            echo "- URL: $SERVICE_URL"
            echo '- Smoke test: passed (health, readiness/DB, HTML, unauthenticated /api/teams -> 401).'
            echo '- See the smoke step for the optional login check (SKIP when not configured).'
          } >> "$GITHUB_STEP_SUMMARY"
